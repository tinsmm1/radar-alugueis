name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgis:
        image: postgis/postgis:16-3.5
        env:
          POSTGRES_PASSWORD: radar
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U postgres" --health-interval 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm lint:typed
      - run: pnpm lint:rules
      - run: pnpm test
      - name: Integration tests (PostGIS)
        env:
          TEST_DATABASE_URL: postgres://postgres:radar@localhost:5432/postgres
        run: pnpm test:integration
      - run: pnpm build
